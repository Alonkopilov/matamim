# A guest who forgot the password resets it with a code emailed to the
# account's address, and logs in with the new one.
#
# Checks:
#   1. "Forgot your password?" opens the reset form. An empty and an invalid
#      email are refused with sign up's messages, without asking Auth
#   2. An email without an account gets the same answer as one with an
#      account (it doesn't tell who has one), and no email is sent
#   3. "Send code" emails a code to the account
#   4. Refused before the code is checked: empty fields, a code that isn't 6
#      digits, passwords that don't match. Nothing reaches Auth
#   5. A wrong code is refused
#   6. "Send a new code" emails another, and the first no longer works
#   7. An unused code expires after an hour: sent 3700 s ago it's refused,
#      and sent about 3300 s ago (plus the flow's own time) the same code is
#      accepted (step 8). Its sent time is moved back by the probe, so the
#      hour is bracketed with one code.
#   8. Happy path: the code and a new password log the account in, "Your
#      password was changed!", the new password works and the old one
#      doesn't, still logged in after a relaunch
#   9. A used code is refused, never because it was replaced or expired:
#      the code from step 8, by the probe right after it's used (its sent
#      time put back first). And in the app after logging out: a fresh code,
#      accepted once by the probe (so the probe's refusals aren't its own),
#      is then refused in the app and changes nothing
#  10. Logging in in the app: the old password is refused, the new one logs
#      in
#
# Until 8, logging in with the old password still works.
appId: com.matamim.app.e2e
name: Account - forgot password
tags:
  - account
---
- runScript: ../../scripts/probe-now.js
- evalScript: ${output.flowStart = output.since}
- runScript:
    file: ../../scripts/mailpit-clear.js
    env:
      EMAIL: "forgot@e2e.test"
- runScript:
    file: ../../scripts/mailpit-clear.js
    env:
      EMAIL: "nobody@e2e.test"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create my first recipe"
    timeout: 20000

# 1. The reset form, and refused emails
- tapOn: "Account"
- tapOn: "Forgot your password\\?"
- extendedWaitUntil:
    visible: "Reset your password"
    timeout: 5000
- assertVisible: "Enter your account's email and we'll send you a code to choose a new password\\."
- assertNotVisible:
    id: "account-password"
- assertNotVisible:
    id: "account-code"
- tapOn:
    id: "account-submit"
- assertVisible: "Email is required\\."
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-email"
      TEXT: "forgot@e2e"
- hideKeyboard
- tapOn:
    id: "account-submit"
- assertVisible: "That email address isn't valid \\(e\\.g\\. example@email\\.com\\)\\."
- assertVisible: "Reset your password"
- runScript:
    file: ../../scripts/probe-cloud-requests.js
    env:
      SINCE: ${output.flowStart}
      PATHS: "/auth/v1/recover"
- assertTrue:
    condition: ${output.cloudRequests === 0}
    label: "Refused emails don't ask Auth for a code"

# 2. An email without an account: the same answer, and no email
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-email"
      TEXT: "nobody@e2e.test"
- hideKeyboard
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "If nobody@e2e\\.test has an account, we sent a code to it\\. Enter it here with your new password\\."
    timeout: 10000
- assertVisible: "Code sent, check your email"
- assertVisible:
    id: "account-code"
# Retried, Kong logs a request once it's answered
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/probe-cloud-requests.js
          env:
            SINCE: ${output.flowStart}
            PATHS: "/auth/v1/recover"
      - assertTrue:
          condition: ${output.cloudRequests === 1}
          label: "Auth was asked for a code"
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: "nobody@e2e.test"
- assertTrue:
    condition: ${output.emailCount === 0}
    label: "No email to an address without an account"
# Back to log in keeps the email, and the reset starts over from the email
- tapOn: "Back to log in"
- extendedWaitUntil:
    visible: "Forgot your password\\?"
    timeout: 5000
- assertVisible:
    id: "account-password"
- assertVisible: "nobody@e2e\\.test"

# 3. A code to the account
- tapOn: "Forgot your password\\?"
- extendedWaitUntil:
    visible: "Reset your password"
    timeout: 5000
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-email"
      TEXT: "forgot@e2e.test"
- hideKeyboard
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: "forgot@e2e.test"
- assertTrue:
    condition: ${output.emailCount === 0}
    label: "Nothing is sent before tapping Send code"
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "If forgot@e2e\\.test has an account, we sent a code to it\\. Enter it here with your new password\\."
    timeout: 10000
- assertVisible: "Code sent, check your email"
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/mailpit-code.js
          env:
            EMAIL: "forgot@e2e.test"
      - assertTrue:
          condition: ${output.emailCount === 1 && output.code.length === 6}
          label: "One code emailed"
- evalScript: ${output.code1 = output.code}
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: "nobody@e2e.test"
- assertTrue:
    condition: ${output.emailCount === 0}
    label: "Still no email to the address without an account"

# 4. Refused before the code is checked
- tapOn:
    id: "account-submit"
- assertVisible: "(?s).*Enter the code from the email\\..*"
- assertVisible: "(?s).*Password is required\\..*"
- tapOn:
    id: "account-code"
- inputText: "123"
- hideKeyboard
- tapOn:
    id: "account-password"
- inputText: "forgot-password-2"
- hideKeyboard
- tapOn:
    id: "account-confirmPassword"
- inputText: "forgot-password-2"
- hideKeyboard
- tapOn:
    id: "account-submit"
- assertVisible: "The code is the 6 digits from the email\\."
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-code"
      TEXT: ${output.code1}
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-confirmPassword"
      TEXT: "forgot-password-3"
- hideKeyboard
- tapOn:
    id: "account-submit"
- assertVisible: "Passwords don't match\\."
- assertNotVisible: "Your password was changed!"
- runScript:
    file: ../../scripts/probe-cloud-requests.js
    env:
      SINCE: ${output.flowStart}
      PATHS: "/auth/v1/verify"
- assertTrue:
    condition: ${output.cloudRequests === 0}
    label: "No code was checked with Auth"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The refused attempts changed nothing"

# 5. A wrong code, with matching passwords
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-confirmPassword"
      TEXT: "forgot-password-2"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-code"
      TEXT: '${output.code1 === "000000" ? "111111" : "000000"}'
- hideKeyboard
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "The code is wrong or has expired"
    timeout: 10000
- assertNotVisible: "Your password was changed!"
- assertVisible:
    id: "account-submit"
- retry:
    maxRetries: 10
    commands:
      - runScript:
          file: ../../scripts/probe-cloud-requests.js
          env:
            SINCE: ${output.flowStart}
            PATHS: "/auth/v1/verify"
      - assertTrue:
          condition: ${output.cloudRequests === 1}
          label: "The wrong code is the first one checked with Auth"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The wrong code changed nothing"

# 6. A new code, and the first one no longer works
- tapOn: "Send a new code"
- extendedWaitUntil:
    visible: "Code sent, check your email"
    timeout: 10000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/mailpit-code.js
          env:
            EMAIL: "forgot@e2e.test"
      - assertTrue:
          condition: ${output.emailCount === 2 && output.code.length === 6}
          label: "A second code emailed"
- evalScript: ${output.code2 = output.code}
- assertTrue:
    condition: ${output.code2 !== output.code1}
    label: "The second code is a new one"
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-code"
      TEXT: ${output.code1}
- hideKeyboard
# The same message is still up from the last attempt, so it's checked once
# Auth has answered this one
- runScript:
    file: ../../scripts/probe-cloud-requests.js
    env:
      SINCE: ${output.flowStart}
      PATHS: "/auth/v1/verify"
- evalScript: ${output.verifiesBefore = output.cloudRequests}
- tapOn:
    id: "account-submit"
- retry:
    maxRetries: 10
    commands:
      - runScript:
          file: ../../scripts/probe-cloud-requests.js
          env:
            SINCE: ${output.flowStart}
            PATHS: "/auth/v1/verify"
      - assertTrue:
          condition: ${output.cloudRequests === output.verifiesBefore + 1}
          label: "Auth answered the first code"
- assertVisible: "The code is wrong or has expired"
- assertNotVisible: "Your password was changed!"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The replaced code changed nothing"

# 7. The newest code, once its hour is up, is refused
- runScript:
    file: ../../scripts/age-codes.js
    env:
      USER: "e2e00000-0000-0000-0000-000000000051"
      SECONDS: "3700"
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-code"
      TEXT: ${output.code2}
- hideKeyboard
- runScript:
    file: ../../scripts/probe-cloud-requests.js
    env:
      SINCE: ${output.flowStart}
      PATHS: "/auth/v1/verify"
- evalScript: ${output.verifiesBefore = output.cloudRequests}
- tapOn:
    id: "account-submit"
- retry:
    maxRetries: 10
    commands:
      - runScript:
          file: ../../scripts/probe-cloud-requests.js
          env:
            SINCE: ${output.flowStart}
            PATHS: "/auth/v1/verify"
      - assertTrue:
          condition: ${output.cloudRequests === output.verifiesBefore + 1}
          label: "Auth answered the expired code"
- assertVisible: "The code is wrong or has expired"
- assertNotVisible: "Your password was changed!"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The expired code changed nothing"
# Put forward to about 3300 s, under the hour, the same code works (step 8).
# The flow's own time since sending it adds to that
- runScript:
    file: ../../scripts/age-codes.js
    env:
      USER: "e2e00000-0000-0000-0000-000000000051"
      SECONDS: "-400"

# 8. Happy path: the code and the new password (still in the fields)
- assertVisible:
    id: "account-code"
    text: ${output.code2}
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "Your password was changed!"
    timeout: 10000
# Logged in: the account, not the form
- extendedWaitUntil:
    notVisible:
      id: "account-submit"
    timeout: 5000
- assertVisible: "forgot@e2e\\.test"
- assertVisible: "Change username"
# The used code is refused. Its sent time is put back to when it was really
# sent, so it can't be refused as expired, and no code was asked for since
- runScript:
    file: ../../scripts/age-codes.js
    env:
      USER: "e2e00000-0000-0000-0000-000000000051"
      SECONDS: "-3300"
- runScript:
    file: ../../scripts/verify-code.js
    env:
      EMAIL: "forgot@e2e.test"
      CODE: ${output.code2}
      TYPE: "recovery"
- assertTrue:
    condition: ${output.verifyStatus === 403}
    label: "The used code is refused when tried again"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: "forgot-password-2"
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "Logging in with the new password works"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 400}
    label: "Logging in with the old password doesn't"
- tapOn: "Recipes"
- assertVisible: "Hello, Forgot Cook!"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Hello, Forgot Cook!"
    timeout: 20000

# 9. A used code in the app, logged out (no recipes, so nothing to warn
#    about)
- tapOn: "Account"
- scrollUntilVisible:
    element: "Delete account"
- tapOn: "Log out"
- extendedWaitUntil:
    visible:
      id: "account-submit"
    timeout: 10000
- tapOn: "Forgot your password\\?"
- extendedWaitUntil:
    visible: "Reset your password"
    timeout: 5000
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-email"
      TEXT: "forgot@e2e.test"
- hideKeyboard
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: "forgot@e2e.test"
- evalScript: ${output.emailsBefore = output.emailCount}
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "If forgot@e2e\\.test has an account, we sent a code to it\\. Enter it here with your new password\\."
    timeout: 10000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/mailpit-code.js
          env:
            EMAIL: "forgot@e2e.test"
      - assertTrue:
          condition: ${output.emailCount === output.emailsBefore + 1 && output.code.length === 6}
          label: "A fresh code emailed"
- evalScript: ${output.code3 = output.code}
# The probe's check accepts the fresh code, which uses it
- runScript:
    file: ../../scripts/verify-code.js
    env:
      EMAIL: "forgot@e2e.test"
      CODE: ${output.code3}
      TYPE: "recovery"
- assertTrue:
    condition: ${output.verifyStatus === 200}
    label: "The probe's check accepts a fresh code"
# The newest code, minutes old, refused only for being used
- tapOn:
    id: "account-code"
- inputText: ${output.code3}
- hideKeyboard
- tapOn:
    id: "account-password"
- inputText: "forgot-password-4"
- hideKeyboard
- tapOn:
    id: "account-confirmPassword"
- inputText: "forgot-password-4"
- hideKeyboard
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "The code is wrong or has expired"
    timeout: 10000
- assertNotVisible: "Your password was changed!"
- assertVisible:
    id: "account-submit"
- runScript:
    file: ../../scripts/verify-code.js
    env:
      EMAIL: "forgot@e2e.test"
      CODE: ${output.code3}
      TYPE: "recovery"
- assertTrue:
    condition: ${output.verifyStatus === 403}
    label: "The probe refuses it too once used"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "forgot@e2e.test"
      PASSWORD: "forgot-password-2"
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The password is still the one from step 8"

# 10. Logging in in the app
- tapOn: "Back to log in"
- extendedWaitUntil:
    visible: "Forgot your password\\?"
    timeout: 5000
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-email"
      TEXT: "forgot@e2e.test"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-password"
      TEXT: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "Wrong email or password"
    timeout: 10000
- assertNotVisible: "Welcome back.*"
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "account-password"
      TEXT: "forgot-password-2"
- hideKeyboard
- tapOn:
    id: "account-submit"
- extendedWaitUntil:
    visible: "Welcome back Forgot Cook!"
    timeout: 15000
- assertVisible: "forgot@e2e\\.test"
- assertNotVisible:
    id: "account-submit"
