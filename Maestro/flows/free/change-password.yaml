# A free account changes its password, after confirming it's them with a
# code emailed to its address.
#
# Checks:
#   1. "Send code" emails a code
#   2. Refused before the code is checked: empty, too short, not English
#      characters, an empty or different confirmation, with sign up's
#      messages
#   3. A wrong code is refused
#   4. "Send a new code" emails another, and the first no longer works
#   5. An unused code expires after an hour: sent 3700 s ago it's refused,
#      and sent 3500 s ago the same code is accepted (step 6). Its sent time
#      is moved back by the probe, so the hour is bracketed with one code.
#   6. The current password as the new one is refused, "That's already your
#      password", and a different one is then asked for without a new code
#   7. Saved: "Password changed!", logging in works with the new password and
#      not the old one, a used code is refused when tried again, and the
#      account stays logged in after a relaunch
#   8. The probe's direct check of a code can accept one: a fresh code is
#      accepted once, then refused (so the refusals above aren't the probe's)
#
# Throughout, until 7, logging in with the old password still works.
appId: com.matamim.app.e2e
name: Free - change password
tags:
  - free
---
- runScript: ../../scripts/probe-now.js
- evalScript: ${output.flowStart = output.since}
- runScript:
    file: ../../scripts/mailpit-clear.js
    env:
      EMAIL: "password@e2e.test"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create my first recipe"
    timeout: 20000
- runFlow:
    file: ../../subflows/login.yaml
    env:
      EMAIL: "password@e2e.test"
      NAME: "Password Cook"

# 1. A code is emailed. The row starts under the floating tab bar.
- scrollUntilVisible:
    element: "Delete account"
- tapOn: "Change password"
- extendedWaitUntil:
    visible: "To make sure it's you, we'll send a code to password@e2e\\.test\\."
    timeout: 5000
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: "password@e2e.test"
- assertTrue:
    condition: ${output.emailCount === 0}
    label: "Nothing is sent before tapping Send code"
- tapOn:
    id: "change-submit"
- extendedWaitUntil:
    visible: "Enter the code we sent to password@e2e\\.test and your new password\\."
    timeout: 10000
- assertVisible: "Code sent, check your email"
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/mailpit-code.js
          env:
            EMAIL: "password@e2e.test"
      - assertTrue:
          condition: ${output.emailCount === 1 && output.code.length === 6}
          label: "One code emailed"
- evalScript: ${output.code1 = output.code}

# 2. Refused passwords, with the right code entered
- tapOn:
    id: "change-code"
- inputText: ${output.code1}
- hideKeyboard
- tapOn:
    id: "change-submit"
- assertVisible: "Password is required\\."
- tapOn:
    id: "change-password"
- inputText: "short1"
- hideKeyboard
- tapOn:
    id: "change-confirmPassword"
- inputText: "short1"
- hideKeyboard
- tapOn:
    id: "change-submit"
- assertVisible: "Password must be at least 8 characters\\."
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-password"
      TEXT: "pässwörd123"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-confirmPassword"
      TEXT: "pässwörd123"
- hideKeyboard
- tapOn:
    id: "change-submit"
- assertVisible: "Password can only contain English characters\\."
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-password"
      TEXT: "new-password-2"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-confirmPassword"
      TEXT: "new-password-3"
- hideKeyboard
- tapOn:
    id: "change-submit"
- assertVisible: "Passwords don't match\\."
- tapOn:
    id: "change-confirmPassword"
- runScript: ../../scripts/probe-cursor-end.js
- eraseText: 30
- hideKeyboard
- tapOn:
    id: "change-submit"
- assertVisible: "Please confirm your password\\."
- assertNotVisible: "Password changed!"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "password@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The refused passwords changed nothing"

# 3. A wrong code, with a valid password
- tapOn:
    id: "change-confirmPassword"
- inputText: "new-password-2"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-code"
      TEXT: '${output.code1 === "000000" ? "111111" : "000000"}'
- hideKeyboard
- tapOn:
    id: "change-submit"
- extendedWaitUntil:
    visible: "The code is wrong or has expired"
    timeout: 10000
- assertNotVisible: "Password changed!"

# 4. A new code, and the first one no longer works
- tapOn: "Send a new code"
- extendedWaitUntil:
    visible: "Code sent, check your email"
    timeout: 10000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/mailpit-code.js
          env:
            EMAIL: "password@e2e.test"
      - assertTrue:
          condition: ${output.emailCount === 2 && output.code.length === 6}
          label: "A second code emailed"
- evalScript: ${output.code2 = output.code}
- assertTrue:
    condition: ${output.code2 !== output.code1}
    label: "The second code is a new one"
# Sending again empties the code field
- assertVisible:
    id: "change-code"
- tapOn:
    id: "change-code"
- inputText: ${output.code1}
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-password"
      TEXT: "new-password-2"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-confirmPassword"
      TEXT: "new-password-2"
- hideKeyboard
- tapOn:
    id: "change-submit"
- extendedWaitUntil:
    visible: "The code is wrong or has expired"
    timeout: 10000
- assertNotVisible: "Password changed!"

# 5. The newest code, once its hour is up, is refused
- runScript:
    file: ../../scripts/age-codes.js
    env:
      USER: "e2e00000-0000-0000-0000-000000000008"
      SECONDS: "3700"
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-code"
      TEXT: ${output.code2}
- hideKeyboard
# The same message is still up from the last attempt, so it's checked once
# Auth has answered this one. Retried, Kong logs a request once it's answered
- runScript:
    file: ../../scripts/probe-cloud-requests.js
    env:
      SINCE: ${output.flowStart}
      PATHS: "/auth/v1/verify"
- evalScript: ${output.verifiesBefore = output.cloudRequests}
- tapOn:
    id: "change-submit"
- retry:
    maxRetries: 10
    commands:
      - runScript:
          file: ../../scripts/probe-cloud-requests.js
          env:
            SINCE: ${output.flowStart}
            PATHS: "/auth/v1/verify"
      - assertTrue:
          condition: ${output.cloudRequests === output.verifiesBefore + 1}
          label: "Auth answered this code"
- assertVisible: "The code is wrong or has expired"
- assertNotVisible: "Password changed!"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "password@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "The expired code changed nothing"
# Sent 3500 s ago, under the hour, the same code works (step 6)
- runScript:
    file: ../../scripts/age-codes.js
    env:
      USER: "e2e00000-0000-0000-0000-000000000008"
      SECONDS: "-200"

# 6. The same code with the current password: the code is accepted, the
#    password isn't
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-password"
      TEXT: ${E2E_PASSWORD}
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-confirmPassword"
      TEXT: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "change-submit"
- extendedWaitUntil:
    visible: "That's already your password"
    timeout: 10000
- assertNotVisible: "Password changed!"
# The code was used, so it isn't asked for again
- assertNotVisible:
    id: "change-code"
- runScript:
    file: ../../scripts/verify-code.js
    env:
      EMAIL: "password@e2e.test"
      CODE: ${output.code2}
      TYPE: "email"
- assertTrue:
    condition: ${output.verifyStatus === 403}
    label: "The used code is refused when tried again"

# 7. A new password
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-password"
      TEXT: "new-password-2"
- hideKeyboard
- runFlow:
    file: ../../subflows/replace-text.yaml
    env:
      ID: "change-confirmPassword"
      TEXT: "new-password-2"
- hideKeyboard
- tapOn:
    id: "change-submit"
- extendedWaitUntil:
    visible: "Password changed!"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "change-password"
    timeout: 5000
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "password@e2e.test"
      PASSWORD: "new-password-2"
- assertTrue:
    condition: ${output.loginStatus === 200}
    label: "Logging in with the new password works"
- runScript:
    file: ../../scripts/login-check.js
    env:
      EMAIL: "password@e2e.test"
      PASSWORD: ${E2E_PASSWORD}
- assertTrue:
    condition: ${output.loginStatus === 400}
    label: "Logging in with the old password doesn't"

# 7. Still logged in after a relaunch
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Hello, Password Cook!"
    timeout: 20000
- tapOn: "Account"
- assertVisible: "password@e2e\\.test"
- assertNotVisible:
    id: "account-submit"

# 8. A fresh code through the probe: accepted, then refused as used
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: "password@e2e.test"
- evalScript: ${output.emailsBefore = output.emailCount}
- scrollUntilVisible:
    element: "Delete account"
- tapOn: "Change password"
- tapOn:
    id: "change-submit"
- extendedWaitUntil:
    visible: "Enter the code we sent to password@e2e\\.test and your new password\\."
    timeout: 10000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../../scripts/mailpit-code.js
          env:
            EMAIL: "password@e2e.test"
      - assertTrue:
          condition: ${output.emailCount === output.emailsBefore + 1 && output.code.length === 6}
          label: "A fresh code emailed"
- runScript:
    file: ../../scripts/verify-code.js
    env:
      EMAIL: "password@e2e.test"
      CODE: ${output.code}
      TYPE: "email"
- assertTrue:
    condition: ${output.verifyStatus === 200}
    label: "The probe's check accepts a fresh code"
- runScript:
    file: ../../scripts/verify-code.js
    env:
      EMAIL: "password@e2e.test"
      CODE: ${output.code}
      TYPE: "email"
- assertTrue:
    condition: ${output.verifyStatus === 403}
    label: "and refuses it once used"
